[package]
name = "randomcard"
version = "0.7.0"
edition = "2024"
license = "MIT"
authors = ["jwindberg"]
description = "A recreation of Apple's HyperCard: stacks of cards, painting, and HyperTalk"
repository = "https://github.com/jwindberg/RandomCard"
# examples/ holds stacks, not Cargo examples.
autoexamples = false

# build.rs: the Windows executable's icon.
[build-dependencies]
miniz_oxide = "0.8.9"
winresource = { version = "0.1.34", default-features = false }

# A packaging tool, not an example: Cargo's example targets are simply the
# way to build a helper program that doesn't ship with the app.
[[example]]
name = "make_icons"
path = "tools/make_icons.rs"

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.23.1"
url = "2.5.8"
chrono = "0.4.45"
eframe = "0.37.0"
epaint_default_fonts = "0.37.0"
miniz_oxide = "0.8.9"
png = "0.18.1"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
rand = "0.10.3"
rfd = "0.17.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
xmrs = "0.15.2"
xmrsplayer = "0.15.0"
# eframe's own winit: where the monitor the window is on starts.
winit = { version = "0.30", default-features = false }
encoding_rs = "0.8.44"
resvg = { version = "0.50.0", default-features = false }
# Connections' secrets (passwords, keys, tokens) in the system's secure
# store: each system's own store is below.
keyring-core = "1.1.0"

# HTTP for scripts (`put url …`). Linux uses Rustls; Windows and macOS use
# the system's own TLS and certificates, which also keeps the C code of
# Rustls' crypto (ring) out of their builds.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = "3.5.1"
# Movies: GStreamer, loaded when a movie opens rather than linked.
libloading = "0.8.9"
# Secrets in the Secret Service (GNOME Keyring, KWallet), over D-Bus in
# Rust, with no C library to install.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3.5.1", default-features = false, features = ["native-tls", "gzip"] }

# Windows: Media Foundation for movies.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
windows-core = "0.62.2"
# Secrets in Windows Credential Manager.
windows-native-keyring-store = "1.1.0"

# macOS: native menus at the top of the screen, in place of winit's default,
# and AVFoundation for movies.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
# Secrets in the Keychain.
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "AVQueuedSampleBufferRendering", "AVSampleBufferAudioRenderer", "AVSampleBufferRenderSynchronizer", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "objc2-core-foundation", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMTimeRange", "objc2", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "objc2"] }
# Movies on the web: AVPlayer is made on the main thread.
dispatch2 = "0.3.1"
