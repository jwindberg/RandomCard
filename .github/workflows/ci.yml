name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the sound library headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      # No rustfmt check: RandomCard's style isn't rustfmt's.
      - name: Audio devices
        shell: pwsh
        run: |
          Get-Service Audiosrv | Format-List Name,Status
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Get-CimInstance Win32_SoundDevice | Format-Table Name,Status
      - name: Test
        run: cargo test --bin randomcard -- --nocapture movies ci_probe
      - name: Build release
        run: cargo build --release
      - name: Check it needs no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dependents = & $dumpbin /nologo /dependents target/release/randomcard.exe
          $dependents
          if ($dependents -match "VCRUNTIME|MSVCP|api-ms-win-crt|ucrtbase") {
            Write-Error "randomcard.exe needs the Visual C++ runtime"
            exit 1
          }
